events {}

error_log /dev/stderr debug;

http {
	proxy_cache_path /cache/ levels=1:2 keys_zone=emlo_cache:10m max_size=10g
                 inactive=60m use_temp_path=off;
        client_max_body_size 8m;

	server {
		listen   80;
		
		listen 443 ssl;
		server_name	emlo-portal.bodleian.ox.ac.uk;
                ssl_certificate     /etc/nginx/ssl/ssl.crt;
                ssl_certificate_key /etc/nginx/ssl/ssl.key;

		## Redirect to https, if client offers it
		set $do_http_upgrade "$https$http_upgrade_insecure_requests";
		if ($do_http_upgrade = "1") {
		#	# We are not using https, but did receive upgrade_insecure_requests header
		#	add_header Vary Upgrade-Insecure-Requests;
			return 307 https://$host$request_uri;
		}

		# Ask browser to upgrade insecure links in content
		add_header Content-Security-Policy "upgrade-insecure-requests" always;

		client_max_body_size 8m;

        # Disallow indexing of USPG exhibit until live
        #location = /robots.txt {
        #        add_header Content-Type text/plain;
        #        return 200 "User-agent: *\nDisallow: /exhibition/uspg/\n";
        #}

        location /exhibition {
            return 301 http://emlo.bodleian.ox.ac.uk/;
        }

        location / {
            return 301 http://emlo.bodleian.ox.ac.uk/;
        }

	location /collections/xmlrpc.php {
		# Block xmlrpc.php after OxCERT request to harden
		# [InfoSec #635328] 
		deny all;
	}

        location /collections {
            return 301 /collections/;
        }
	    location /collections/ {
	        #add_header 'Access-Control-Allow-Origin' 'http://emlo.bodleian.ox.ac.uk';
	        add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET';
		add_header Content-Security-Policy "upgrade-insecure-requests" always;

	        proxy_set_header X-Real-IP  $remote_addr;
	        proxy_set_header X-Forwarded-For $remote_addr;
	        proxy_set_header Host $host;
	        proxy_pass http://wp-catalogues;

		}

        location /exhibition/baxter {
            return 301 /exhibition/baxter/;
        }
        location /exhibition/baxter/ {
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://omk-baxter;
        }

        location /exhibition/sw {
            return 301 /exhibition/sw/;
        }
        location /exhibition/sw/ {
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://omk-sw;
        }

        location /exhibition/uspg {
            return 301 /exhibition/uspg/;
        }
        location /exhibition/uspg/ {
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://omk-uspg;
        }

        location /wemlo {
            return 301 /wemlo/;
        }
        location /wemlo/ {
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://omk-wemlo;
        }

	location /rs_viz/ {
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://rs-viz:8050/rs_viz/;
	}

	location /static/ {
            alias /static/;
	    autoindex off;
	}

        location /exhibitions/ {
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_pass http://omeka-s;
            client_max_body_size 8m;
        }

	}
}
